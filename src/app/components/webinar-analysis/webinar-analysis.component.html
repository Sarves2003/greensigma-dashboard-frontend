<div class="main-tab-shell">
  <div
    class="main-tab-switcher"
    *ngIf="authService.hasPermission(permissions.webinarAnalysisMain) && authService.hasPermission(permissions.webinarAnalysisRegistrations)"
  >
    <button type="button" class="main-tab-btn" [class.active]="activeMainTab === 'zoom'" (click)="setMainTab('zoom')">
      🎥 Zoom Analysis
    </button>
    <button type="button" class="main-tab-btn" [class.active]="activeMainTab === 'registrations'" (click)="setMainTab('registrations')">
      🧾 Webinar Registrations
    </button>
  </div>

  <app-zoom-analysis *ngIf="activeMainTab === 'zoom' && authService.hasPermission(permissions.webinarAnalysisMain)"></app-zoom-analysis>
  <app-webinar-registrations *ngIf="activeMainTab === 'registrations' && authService.hasPermission(permissions.webinarAnalysisRegistrations)"></app-webinar-registrations>
</div>
