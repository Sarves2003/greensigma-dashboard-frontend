<div class="dashboard-container">
  <div class="header">
    <h1>Cohort Retention Analytics</h1>
  </div>

  <app-filter-bar (filterChange)="onFilterChange($event)"></app-filter-bar>

  <!-- Granularity Selector -->
  <div class="controls">
    <label>Retention Period:</label>
    <div class="button-group">
      <button
        [class.active]="granularity === 'monthly'"
        (click)="granularity = 'monthly'; onGranularityChange()"
      >
        Monthly
      </button>
      <button
        [class.active]="granularity === 'quarterly'"
        (click)="granularity = 'quarterly'; onGranularityChange()"
      >
        Quarterly
      </button>
      <button
        [class.active]="granularity === 'yearly'"
        (click)="granularity = 'yearly'; onGranularityChange()"
      >
        Yearly
      </button>
    </div>
  </div>

  <div *ngIf="loading" class="loading">Loading retention data...</div>
  <div *ngIf="error" class="error">{{ error }}</div>

  <ng-container *ngIf="!loading">
    <!-- Cohort Heatmap -->
    <div class="heatmap-section">
      <h2>Cohort Retention Heatmap</h2>
      <div class="heatmap-container">
        <table class="cohort-table">
          <thead>
            <tr>
              <th class="cohort-label">Cohort</th>
              <th class="total-users">Users</th>
              <ng-container *ngFor="let col of cohortColumns">
                <th class="retention-column">{{ col }}</th>
              </ng-container>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let row of cohortRows">
              <td class="cohort-label">{{ row.cohort }}</td>
              <td class="total-users">{{ row.totalUsers }}</td>
              <ng-container *ngFor="let col of cohortColumns">
                <td
                  class="retention-cell"
                  [style.backgroundColor]="getRetentionColor(getCellValue(row, col))"
                  [title]="getCellDisplay(row, col)"
                >
                  {{ getCellDisplay(row, col) }}
                </td>
              </ng-container>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
